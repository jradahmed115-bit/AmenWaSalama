name: Build Android APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Prepare build environment
    run: |
      sudo apt-get update
      sudo apt-get install -y nodejs npm zip

  - name: Build APK
    run: |
      mkdir -p output
      echo "This project needs Android packaging configuration." > output/README.txt
      zip -r output/HSE-Security.zip index.html

  - name: Upload build files
    uses: actions/upload-artifact@v4
    with:
      name: HSE-Security
      path: output/
